<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Garimpo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style-login.css">
</head>
<body>

<header class="auth-header">
  <a href="index.html" class="logo">
    <div class="logo-icon">🪡</div>
    <span class="logo-text">Gari<span>mpo</span></span>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
      <button class="auth-tab" onclick="switchTab('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form class="auth-form" id="form-login">
      <div class="field">
        <label for="email-login">E-mail</label>
        <input type="email" id="email-login" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha-login">
          Senha
          <a href="#" class="label-link">Esqueci minha senha</a>
        </label>
        <input type="password" id="senha-login" placeholder="••••••••" autocomplete="current-password">
      </div>
      <p class="auth-error" id="error-login"></p>
      <button type="submit" class="btn-auth">Entrar</button>
    </form>

    <!-- CADASTRO -->
    <form class="auth-form hidden" id="form-cadastro">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Como você quer ser chamado" autocomplete="name">
      </div>
      <div class="field">
        <label for="email-cadastro">E-mail</label>
        <input type="email" id="email-cadastro" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" placeholder="(11) 99999-9999">
      </div>
      <div class="field">
        <label for="senha-cadastro">Senha</label>
        <input type="password" id="senha-cadastro" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <p class="auth-error" id="error-cadastro"></p>
      <p class="auth-success hidden" id="success-cadastro">Conta criada! Faça login para continuar.</p>
      <button type="submit" class="btn-auth">Criar conta</button>
      <p class="auth-terms">Ao criar uma conta você concorda com nossos <a href="#">Termos de uso</a> e <a href="#">Política de privacidade</a>.</p>
    </form>

    <div class="auth-divider"><span>ou</span></div>

    <div class="social-buttons">
      <button class="btn-social">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar com Google
      </button>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<script>
  // Se já estiver logado, vai direto para home
  if (isLoggedIn()) window.location.href = 'index.html';

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
    document.querySelectorAll('.auth-tab')[tab === 'login' ? 0 : 1].classList.add('active');
    document.getElementById('form-' + tab).classList.remove('hidden');
  }

  document.getElementById('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const errEl = document.getElementById('error-login');
    errEl.textContent = '';
    btn.textContent = 'Entrando…'; btn.disabled = true;

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({
          email: document.getElementById('email-login').value.trim(),
          password: document.getElementById('senha-login').value
        })
      });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      const next = new URLSearchParams(location.search).get('next') || 'index.html';
      window.location.href = next;
    } catch(err) {
      errEl.textContent = err.message;
      btn.textContent = 'Entrar'; btn.disabled = false;
    }
  });

  document.getElementById('form-cadastro').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    const errEl = document.getElementById('error-cadastro');
    const okEl  = document.getElementById('success-cadastro');
    errEl.textContent = ''; okEl.classList.add('hidden');

    const nome         = document.getElementById('nome').value.trim();
    const email        = document.getElementById('email-cadastro').value.trim();
    const password     = document.getElementById('senha-cadastro').value;
    const num_telefone = document.getElementById('telefone').value.trim();

    btn.textContent = 'Criando…'; btn.disabled = true;

    try {
      await apiFetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, password, telefone })
      });
      okEl.classList.remove('hidden');
      document.getElementById('email-login').value = document.getElementById('email-cadastro').value;
      setTimeout(() => switchTab('login'), 1200);
    } catch(err) {
      errEl.textContent = err.message;
    } finally {
      btn.textContent = 'Criar conta'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
