<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anunciar — Garimpo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style-pages.css">
</head>
<body class="page-white">

<header class="auth-header">
  <a href="index.html" class="logo">
    <div class="logo-icon">🪡</div>
    <span class="logo-text">Gari<span>mpo</span></span>
  </a>
</header>

<main class="form-main">
  <div class="form-header">
    <h1 class="form-title">Nova peça</h1>
    <p class="form-sub">Preencha as informações abaixo para anunciar</p>
  </div>

  <form id="form-anunciar">

    <section class="form-section">
      <h2 class="form-section-title">Fotos</h2>
      <div class="upload-grid">
        <label class="upload-main" for="foto-1" id="label-foto-1">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>Foto principal</span>
          <span class="upload-hint">clique para adicionar</span>
          <input type="file" id="foto-1" accept="image/*" hidden>
        </label>
        <label class="upload-extra" for="foto-2" id="label-foto-2"><span>+</span><input type="file" id="foto-2" accept="image/*" hidden></label>
        <label class="upload-extra" for="foto-3" id="label-foto-3"><span>+</span><input type="file" id="foto-3" accept="image/*" hidden></label>
        <label class="upload-extra" for="foto-4" id="label-foto-4"><span>+</span><input type="file" id="foto-4" accept="image/*" hidden></label>
      </div>
      <p class="field-hint">Adicione até 4 fotos. A primeira será a capa do anúncio.</p>
    </section>

    <div class="form-divider"></div>

    <section class="form-section">
      <h2 class="form-section-title">Informações</h2>
      <div class="fields">
        <div class="field">
          <label for="titulo">Título do anúncio</label>
          <input type="text" id="titulo" placeholder="Ex: Jaqueta jeans azul anos 90">
        </div>
        <div class="field">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" rows="4" placeholder="Conte sobre a peça: estado, medidas, história, tecido…"></textarea>
        </div>
        <div class="fields-row">
          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria">
              <option value="" disabled selected>Selecione</option>
            </select>
          </div>
          <div class="field">
            <label for="condicao">Condição</label>
            <select id="condicao">
              <option value="" disabled selected>Selecione</option>
              <option>Novo</option>
              <option>Ótimo estado</option>
              <option>Bom estado</option>
              <option>Com marcas de uso</option>
            </select>
          </div>
        </div>
        <div class="fields-row">
          <div class="field">
            <label for="tamanho">Tamanho <span class="label-opt">opcional</span></label>
            <input type="text" id="tamanho" placeholder="Ex: M, 38, único…">
          </div>
          <div class="field">
            <label for="marca">Marca <span class="label-opt">opcional</span></label>
            <input type="text" id="marca" placeholder="Ex: Zara, sem marca…">
          </div>
        </div>
      </div>
    </section>

    <div class="form-divider"></div>

    <section class="form-section">
      <h2 class="form-section-title">Preço e entrega</h2>
      <div class="fields">
        <div class="fields-row">
          <div class="field">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" placeholder="0,00" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="cep">CEP de origem</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
          </div>
        </div>
        <div class="field">
          <label>Forma de envio</label>
          <div class="radio-group">
            <label class="radio-opt"><input type="radio" name="envio" value="correios" checked><span>Correios (etiqueta gerada automaticamente)</span></label>
            <label class="radio-opt"><input type="radio" name="envio" value="combinar"><span>Combinar com o comprador</span></label>
          </div>
        </div>
      </div>
    </section>

    <div class="form-divider"></div>

    <p class="form-error" id="form-error" style="margin-bottom:.5rem"></p>

    <div class="form-actions">
      <button type="button" class="btn-preview" onclick="window.location.href='index.html'">Cancelar</button>
      <button type="submit" class="btn-publish">Publicar anúncio</button>
    </div>

  </form>
</main>

<script src="../js/api.js"></script>
<script>
  requireAuth();

  // Carrega categorias do backend
  async function loadCategorias() {
    try {
      const cats = await apiFetch('/categorias');
      const sel = document.getElementById('categoria');
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nome;
        sel.appendChild(opt);
      });
    } catch(e) {
      // fallback estático
      ['Roupas','Calçados','Brinquedos','Livros','Acessórios','Decoração','Eletrônicos','Móveis','Outros'].forEach(n => {
        document.getElementById('categoria').innerHTML += `<option>${n}</option>`;
      });
    }
  }

  // Preview de imagem
  document.querySelectorAll('input[type="file"]').forEach(input => {
    input.addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const label = this.closest('label');
      const reader = new FileReader();
      reader.onload = e => {
        label.style.backgroundImage = `url(${e.target.result})`;
        label.style.backgroundSize = 'cover';
        label.style.backgroundPosition = 'center';
        label.querySelectorAll('span,svg').forEach(el => el.style.opacity = '0');
      };
      reader.readAsDataURL(file);
    });
  });

  // Máscara CEP
  document.getElementById('cep').addEventListener('input', function() {
    let v = this.value.replace(/\D/g,'').slice(0,8);
    if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5);
    this.value = v;
  });

  // Envio
  document.getElementById('form-anunciar').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('form-error');
    const btn   = document.querySelector('.btn-publish');
    errEl.textContent = '';

    const title       = document.getElementById('titulo').value.trim();
    const categoria_id = document.getElementById('categoria').value;
    const conditions  = document.getElementById('condicao').value;
    const price       = document.getElementById('preco').value;

    if (!title || !categoria_id || !conditions || !price) {
      errEl.textContent = 'Preencha título, categoria, condição e preço.';
      return;
    }

    btn.textContent = 'Publicando…'; btn.disabled = true;

    try {
      const data = await apiFetch('/produtos', {
        method: 'POST',
        body: JSON.stringify({
          title,
          description: document.getElementById('descricao').value.trim(),
          category: document.getElementById('categoria').selectedOptions[0]?.text,
          conditions,
          type: document.getElementById('tamanho').value.trim() || null,
          price: parseFloat(price),
          categoria_id: parseInt(categoria_id)
        })
      });
      window.location.href = `produto.html?id=${data.produto.id}`;
    } catch(err) {
      errEl.textContent = err.message;
      btn.textContent = 'Publicar anúncio'; btn.disabled = false;
    }
  });

  loadCategorias();
</script>
</body>
</html>
