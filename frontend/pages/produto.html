<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — Garimpo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style-produto.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🪡</div>
      <span class="logo-text">Gari<span>mpo</span></span>
    </a>
    <div class="search-bar">
      <svg class="search-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input" placeholder="Buscar peças, marcas, estilos…">
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-account" title="Conta">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
      <a href="sacola.html" class="icon-btn" title="Sacola" style="text-decoration:none">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </a>

      <button class="icon-btn" id="btn-notificacao" onclick="toggleNotificacoes()" title="Notificações">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="badge" id="badge-notificacao" style="display:none;">0</span>
      </button>

<!-- dropdown de notificações -->
      <div class="notif-dropdown" id="notif-dropdown" style="display:none;">
        <div class="notif-header">
          <span>Notificações</span>
          <button onclick="marcarTodasLidas()">Marcar todas como lidas</button>
        </div>
        <div id="notif-lista">
          <div class="notif-empty">Nenhuma notificação</div>
        </div>
      </div>

      <a href="anunciar.html" id="btn-sell" class="btn-sell">+ Vender</a>
    </div>
  </div>
</header>

<nav class="breadcrumb">
  <a href="index.html">Início</a>
  <span>›</span>
  <a href="resultados.html" id="bc-categoria">Produtos</a>
  <span>›</span>
  <span id="bc-titulo">Carregando…</span>
</nav>

<div class="product-page" id="product-page">
  <div class="loading" style="grid-column:1/-1;padding:4rem;text-align:center;">Carregando produto…</div>
</div>

<div class="related-section" id="related-section" style="display:none">
  <div class="section-header">
    <h2 class="section-title">Você também pode <span>gostar</span></h2>
    <a href="resultados.html" class="see-all">Ver mais →</a>
  </div>
  <div class="carousel-wrapper">
    <button class="carousel-btn prev" onclick="scrollCarousel(this,-1)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="carousel-track" id="track-relacionados"></div>
    <button class="carousel-btn next" onclick="scrollCarousel(this,1)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
</div>

<!-- AVALIAÇÕES -->
<div class="reviews-section" id="reviews-section" style="max-width: 1200px; margin:2rem auto; padding: 0 1.5rem;">
  <h2 class="section-title" style="margin-bottom: 1.5rem;">Avaliações do <span>vendedor</span></h2>
  <div id="lista-avaliacoes"><div class="loading">Carregando...</div></div>
</div>

<footer>
  <div class="footer-logo">🪡 Garimpo</div>
  <p>© 2025 Garimpo — Marketplace de brechó. Feito com ♻️ no Brasil.</p>
</footer>

<script src="../js/api.js"></script>
<script>
  const COLORS = ['#F0E6D3','#E8D5C4','#D9E8D3','#E8D9D9','#DDD9E8','#E8E4D3'];
  const id = new URLSearchParams(location.search).get('id');
  if (!id) window.location.href = 'index.html';

  let produtoAtual = null;

async function loadAvaliacoes(vendedor_id) {
  try {
    const data = await apiFetch('/avaliacoes/usuario/' + vendedor_id);
    const el = document.getElementById('lista-avaliacoes');

    if (!data.total) {
      el.innerHTML = '<p style="color:#aaa;font-size:.88rem;">Nenhuma avaliação ainda.</p>';
      return;
    }

    const estrelas = (rating) => '⭐'.repeat(rating) + '☆'.repeat(5 - rating);

    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <span style="font-size:2.5rem;font-weight:700;color:#C4622D;">${data.media}</span>
        <div>
          <div style="font-size:1.2rem;">${estrelas(Math.round(data.media))}</div>
          <div style="font-size:.82rem;color:#aaa;">${data.total} avaliação${data.total > 1 ? 'ões' : ''}</div>
        </div>
      </div>
      ${data.avaliacao.map(a => `
        <div style="border:1px solid #eee;border-radius:12px;padding:1rem;margin-bottom:.75rem;">
          <div style="display:flex;justify-content:space-between;margin-bottom:.4rem;">
            <span style="font-weight:500;font-size:.88rem;">${a.reviewer?.nome || 'Usuário'}</span>
            <span>${estrelas(a.rating)}</span>
          </div>
          ${a.comentario ? `<p style="font-size:.85rem;color:#555;margin:0;">${a.comentario}</p>` : ''}
          <div style="font-size:.75rem;color:#aaa;margin-top:.4rem;">${timeAgo(a.created_at)}</div>
        </div>`).join('')}`;
  } catch(e) {
    document.getElementById('lista-avaliacoes').innerHTML = '<p style="color:#aaa;">Erro ao carregar avaliações.</p>';
  }
}

  async function loadProduto() {
    try {
      const p = await apiFetch('/produtos/' + id);
      produtoAtual = p;

      document.title = p.title + ' — Garimpo';
      document.getElementById('bc-titulo').textContent = p.title;
      const cat = p.category || p.categoria?.nome || 'Produtos';
      const bcCat = document.getElementById('bc-categoria');
      bcCat.textContent = cat;
      bcCat.href = 'resultados.html?categoria=' + encodeURIComponent(cat);

      const imagens = p.imagens || [];
      const thumbsHtml = imagens.length
        ? imagens.map((img, i) => `
            <div class="thumb ${i===0?'active':''}" onclick="selectThumb(this,'${img.image_url}')">
              <img src="${img.image_url}" alt="foto ${i+1}">
            </div>`).join('')
        : '<div class="thumb active">📦</div>';

      const mainContent = imagens[0]?.image_url
        ? `<img src="${imagens[0].image_url}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;">`
        : '<span style="font-size:5rem">📦</span>';

      document.getElementById('product-page').innerHTML = `
        <div class="gallery">
          <div class="gallery-main">
            <div id="main-content">${mainContent}</div>
            ${p.conditions ? `<span class="gallery-main-badge">${p.conditions}</span>` : ''}
          </div>
          <div class="gallery-thumbs">${thumbsHtml}</div>
        </div>

        <div class="product-details">
          <div class="detail-category">${cat}</div>
          <h1 class="detail-title">${p.title}</h1>

          <div class="price-row">
            <span class="price-main">${formatPrice(p.price)}</span>
          </div>

          <div class="attrs">
            ${p.conditions ? `<div class="attr"><span class="attr-label">Condição</span><span class="attr-value">${p.conditions}</span></div>` : ''}
            ${p.type ? `<div class="attr"><span class="attr-label">Tamanho</span><span class="attr-value">${p.type}</span></div>` : ''}
          </div>

          <div class="action-buttons">
            <button class="btn-buy" onclick="comprar()">Comprar agora</button>
            <button class="btn-cart" id="btn-cart" onclick="adicionarSacola()">Adicionar à sacola</button>
            <button class="btn-wish" id="wishBtn">🤍</button>
          </div>

          <div class="shipping-row">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="1" y="3" width="15" height="13" rx="1"/>
              <path d="M16 8h4l3 5v3h-7V8z"/>
              <circle cx="5.5" cy="18.5" r="2.5"/>
              <circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
            <span><strong>Frete facilitado</strong> · etiqueta gerada automaticamente</span>
          </div>

          ${p.description ? `<div class="description-block"><p>${p.description}</p></div>` : ''}

          <div class="seller-block">
            <div class="seller-block-avatar">👤</div>
            <div>
              <div class="seller-block-name">${p.user?.nome || 'Vendedor'}</div>
              <div class="seller-block-meta">${p.user?.city || ''}</div>
            </div>
            <button class="btn-seller" onclick="window.location.href='perfil.html?id=${p.user_id}'">Ver perfil →</button>
          </div>
        </div>`;

      document.getElementById('wishBtn').addEventListener('click', function() {
        this.textContent = this.textContent.trim() === '🤍' ? '❤️' : '🤍';
        this.style.transform = 'scale(1.2)';
        setTimeout(() => this.style.transform = '', 200);
      });
      produtoAtual = 1;
      loadAvaliacoes(p.user_id);

      loadRelacionados(cat);
    } catch(e) {
      document.getElementById('product-page').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1"><h3>Produto não encontrado</h3><p><a href="index.html">Voltar ao início</a></p></div>';
    }
  }

  async function loadRelacionados(categoria) {
    try {
      const todos = await apiFetch('/produtos');
      const rel = todos.filter(p => p.id != id && (p.category === categoria || p.categoria?.nome === categoria)).slice(0, 6);
      if (!rel.length) return;
      document.getElementById('track-relacionados').innerHTML = rel.map(p => `
        <a class="product-card" href="produto.html?id=${p.id}">
          <div class="product-img" style="background:${COLORS[p.id%COLORS.length]};">
            ${p.imagens?.[0]?.image_url ? `<img src="${p.imagens[0].image_url}" alt="${p.title}">` : ''}
            <button class="wishlist-btn" onclick="event.preventDefault();this.textContent=this.textContent.trim()==='🤍'?'❤️':'🤍'">🤍</button>
          </div>
          <div class="product-info">
            <div class="product-category">${p.category || p.categoria?.nome || ''}</div>
            <div class="product-name">${p.title}</div>
            <div class="product-seller">por ${p.user?.nome || ''}</div>
            <div class="product-footer">
              <span class="product-price">${formatPrice(p.price)}</span>
              ${p.type ? `<span class="product-size">${p.type}</span>` : ''}
            </div>
          </div>
        </a>`).join('');
      document.getElementById('related-section').style.display = 'block';
    } catch(e) {}
  }

  function selectThumb(el, url) {
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const main = document.getElementById('main-content');
    main.innerHTML = url
      ? `<img src="${url}" alt="produto" style="width:100%;height:100%;object-fit:cover;">`
      : '<span style="font-size:5rem">📦</span>';
  }

  function adicionarSacola() {
    if (!produtoAtual) return;
    const adicionado = addToSacola(produtoAtual);
    const btn = document.getElementById('btn-cart');
    if (adicionado) {
      btn.textContent = '✓ Adicionado';
      btn.style.cssText = 'background:var(--sage);color:white;border-color:var(--sage)';
    } else {
      window.location.href = 'sacola.html';
    }
  }

  async function comprar() {
    if (!isLoggedIn()) {
      window.location.href = 'login.html?next=produto.html?id=' + id;
      return;
    }
    try {
      await apiFetch('/pedidos', {
        method: 'POST',
        body: JSON.stringify({ produto_id: parseInt(id) })
      });
      alert('Pedido realizado! Acompanhe em Minha Conta.');
      window.location.href = 'minha-conta.html';
    } catch(e) {
      alert(e.message);
    }
  }

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim())
      window.location.href = 'resultados.html?q=' + encodeURIComponent(e.target.value.trim());
  });

  loadProduto();
</script>
</body>
</html>
