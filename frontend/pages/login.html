<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Garimpo</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-login.css">
</head>
<body>

<!-- ── CABEÇALHO MINIMALISTA ── -->
<header class="auth-header">
  <a href="index.html" class="logo">
    <div class="logo-icon">🪡</div>
    <span class="logo-text">Gari<span>mpo</span></span>
  </a>
</header>

<!-- ── CONTAINER ── -->
<main class="auth-main">
  <div class="auth-card">

    <!-- ABAS -->
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Entrar</button>
      <button class="auth-tab" onclick="switchTab('cadastro')">Criar conta</button>
    </div>

    <!-- FORMULÁRIO: LOGIN -->
    <form class="auth-form" id="form-login">
      <div class="field">
        <label for="email-login">E-mail</label>
        <input type="email" id="email-login" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha-login">
          Senha
          <a href="#" class="label-link">Esqueci minha senha</a>
        </label>
        <input type="password" id="senha-login" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-auth">Entrar</button>
    </form>

    <!-- FORMULÁRIO: CADASTRO -->
    <form class="auth-form hidden" id="form-cadastro">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Como você quer ser chamado" autocomplete="name">
      </div>
      <div class="field">
        <label for="email-cadastro">E-mail</label>
        <input type="email" id="email-cadastro" placeholder="seu@email.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="senha-cadastro">Senha</label>
        <input type="password" id="senha-cadastro" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-auth">Criar conta</button>
      <p class="auth-terms">
        Ao criar uma conta você concorda com nossos
        <a href="#">Termos de uso</a> e <a href="#">Política de privacidade</a>.
      </p>
    </form>

    <!-- DIVISOR -->
    <div class="auth-divider"><span>ou</span></div>

    <!-- SOCIAL -->
    <div class="social-buttons">
      <button class="btn-social">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar com Google
      </button>
    </div>

  </div>
</main>

<script src="main.js"></script>
<script>
  const API = 'http://localhost:3000';

  // ── ABAS ──
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.add('hidden'));
    const idx = tab === 'login' ? 0 : 1;
    document.querySelectorAll('.auth-tab')[idx].classList.add('active');
    document.getElementById('form-' + tab).classList.remove('hidden');
    clearError();
  }

  // ── ERRO ──
  function showError(msg) {
    let el = document.getElementById('auth-error');
    if (!el) {
      el = document.createElement('p');
      el.id = 'auth-error';
      el.style.cssText = 'color:#c0392b;font-size:0.82rem;text-align:center;margin-top:0.5rem';
      document.querySelector('.auth-card').appendChild(el);
    }
    el.textContent = msg;
  }

  function clearError() {
    const el = document.getElementById('auth-error');
    if (el) el.textContent = '';
  }

  // ── LOGIN ──
  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const btn = e.target.querySelector('button[type="submit"]');
    btn.textContent = 'Entrando…';
    btn.disabled = true;

    const email    = document.getElementById('email-login').value.trim();
    const password = document.getElementById('senha-login').value;

    try {
      const res  = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Erro ao entrar');
        return;
      }

      // Salva token e dados do usuário
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      // Redireciona para a página inicial
      window.location.href = 'index.html';

    } catch (err) {
      showError('Não foi possível conectar ao servidor');
    } finally {
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  });

  // ── CADASTRO ──
  document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();

    const btn = e.target.querySelector('button[type="submit"]');
    btn.textContent = 'Criando conta…';
    btn.disabled = true;

    const nome     = document.getElementById('nome').value.trim();
    const email    = document.getElementById('email-cadastro').value.trim();
    const password = document.getElementById('senha-cadastro').value;

    if (password.length < 8) {
      showError('A senha deve ter pelo menos 8 caracteres');
      btn.textContent = 'Criar conta';
      btn.disabled = false;
      return;
    }

    try {
      const res  = await fetch(`${API}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Erro ao criar conta');
        return;
      }

      // Cadastro ok → vai para o login automaticamente
      switchTab('login');
      document.getElementById('email-login').value = email;
      showError(''); 
      const success = document.getElementById('auth-error') || document.createElement('p');
      success.style.color = '#27ae60';
      success.textContent = 'Conta criada! Faça login para continuar.';

    } catch (err) {
      showError('Não foi possível conectar ao servidor');
    } finally {
      btn.textContent = 'Criar conta';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
